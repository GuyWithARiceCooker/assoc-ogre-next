display_information:
  name: assoc-agent
  description: Talk to the assoc AI assistant from Slack.
  background_color: "#2f6fad"
features:
  bot_user:
    display_name: assoc-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
